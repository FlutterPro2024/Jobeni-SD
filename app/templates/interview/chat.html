{% extends "base.html" %}
{% block title %}المحاكي الذكي: {{ job_title }}{% endblock %}

{% block content %}
<div class="container py-4" dir="rtl">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden" style="height: 85vh;">
                <div class="card-header bg-dark text-white p-3 d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center">
                        <div class="status-dot bg-success rounded-circle ms-2"></div>
                        <div class="text-end">
                            <h6 class="mb-0 fw-bold">مدير التوظيف الذكي (AI)</h6>
                            <small class="text-info">{{ job_title }}</small>
                        </div>
                    </div>
                    <button id="finish-session-btn" class="btn btn-sm btn-outline-danger border-0 rounded-pill">
                        <i class="fas fa-flag-checkered ms-1"></i> إنهاء والتقييم
                    </button>
                </div>

                <div class="card-body bg-light px-4 py-4" id="chat-window" style="overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background-image: url('https://www.transparenttextures.com/patterns/cubes.png');">
                    <div class="ai-msg p-3 bg-white rounded-4 shadow-sm align-self-start border-start border-primary border-4" style="max-width: 85%;">
                        <div class="d-flex align-items-center mb-2">
                            <i class="fas fa-robot text-primary ms-2"></i>
                            <strong class="small text-muted">HR Manager</strong>
                        </div>
                        <div class="chat-text" style="white-space: pre-wrap; line-height: 1.7;">{{ first_question }}</div>
                    </div>
                </div>

                <div id="typing-indicator" class="px-4 py-2 bg-light text-muted small" style="display: none;">
                    <span class="spinner-grow spinner-grow-sm text-primary"></span> جاري تفكير الوكيل...
                </div>

                <div class="card-footer bg-white p-3 border-0">
                    <div class="input-group shadow-sm rounded-pill overflow-hidden border">
                        <input type="text" id="user-input" class="form-control border-0 px-4 py-2 text-end" placeholder="اكتب إجابتك هنا...">
                        <button class="btn btn-primary px-4" id="send-btn"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="reportModal" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg text-end">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header bg-primary text-white border-0 text-center d-block">
                <h5 class="modal-title fw-bold">📊 تقرير الأداء النهائي</h5>
            </div>
            <div class="modal-body p-4" id="report-content">
                </div>
            <div class="modal-footer border-0 justify-content-center">
                <a href="{{ url_for('auth.dashboard') }}" class="btn btn-primary rounded-pill px-5">العودة للوحة التحكم</a>
            </div>
        </div>
    </div>
</div>

<style>
    .rounded-4 { border-radius: 1.2rem !important; }
    .status-dot { width: 10px; height: 10px; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
    .user-msg { animation: fadeInLeft 0.3s ease; background: linear-gradient(135deg, #0d6efd, #0b5ed7) !important; }
    @keyframes fadeInLeft { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
    .ai-msg { animation: fadeInRight 0.3s ease; }
    @keyframes fadeInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    #chat-window::-webkit-scrollbar { width: 5px; }
    #chat-window::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
</style>

<script>
let chatHistory = "AI: {{ first_question | replace('\n', ' ') }}\n";
const chatWindow = document.getElementById('chat-window');
const typingIndicator = document.getElementById('typing-indicator');

async function sendMessage() {
    let input = document.getElementById('user-input');
    let message = input.value.trim();
    if(!message) return;

    appendMessage('أنت', message, 'align-self-end text-white user-msg rounded-4 p-3 shadow-sm');
    input.value = "";
    typingIndicator.style.display = 'block';

    try {
        const response = await fetch('/interview/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ message, history: chatHistory, job_title: "{{ job_title }}" })
        });

        const data = await response.json();
        typingIndicator.style.display = 'none';
        appendMessage('HR Manager', data.response, 'align-self-start bg-white shadow-sm rounded-4 p-3 border-end border-primary border-4');
        chatHistory += `Candidate: ${message}\nAI: ${data.response}\n`;
    } catch (e) {
        typingIndicator.innerHTML = "⚠️ خطأ في الاتصال..";
    }
}

document.getElementById('send-btn').onclick = sendMessage;
document.getElementById('user-input').onkeypress = (e) => { if(e.which == 13) sendMessage(); };

document.getElementById('finish-session-btn').onclick = async function() {
    if(!confirm('هل انتهيت من المقابلة؟ سنقوم بتحليل إجاباتك الآن.')) return;

    typingIndicator.style.display = 'block';
    typingIndicator.innerHTML = "جاري تحليل أدائك، ثوانٍ فقط...";

    const resp = await fetch('/interview/finish', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ history: chatHistory, job_title: "{{ job_title }}" })
    });

    const data = await resp.json();
    typingIndicator.style.display = 'none';

    document.getElementById('report-content').innerHTML = `
        <div class="text-center mb-4">
            <h1 class="display-2 fw-bold text-primary">${data.score}</h1>
            <p class="text-muted">نسبة الجاهزية للمقابلة الحقيقية</p>
        </div>
        <div class="row g-3">
            <div class="col-md-6"><div class="p-3 bg-success-subtle rounded-4 h-100 shadow-sm border-0"><strong>✅ نقاط القوة:</strong><ul class="mt-2">${data.strengths.map(s=>`<li>${s}</li>`).join('')}</ul></div></div>
            <div class="col-md-6"><div class="p-3 bg-danger-subtle rounded-4 h-100 shadow-sm border-0"><strong>⚠️ نقاط التطوير:</strong><ul class="mt-2">${data.weaknesses.map(w=>`<li>${w}</li>`).join('')}</ul></div></div>
        </div>
        <div class="mt-4 p-3 bg-light rounded-4 border-end border-4 border-primary shadow-sm"><strong>💡 الخلاصة:</strong><p class="mt-1">${data.overall_feedback}</p></div>
        <div class="mt-3 p-3 bg-warning-subtle rounded-4 border-0 shadow-sm"><strong>🌟 نصيحة القبول:</strong><p class="mb-0 mt-1">${data.recommendation}</p></div>
    `;
    new bootstrap.Modal(document.getElementById('reportModal')).show();
};

function appendMessage(sender, text, classes) {
    let div = document.createElement('div');
    div.className = classes;
    div.style.maxWidth = "85%";
    div.innerHTML = `<small class="d-block mb-1 fw-bold opacity-75">${sender}</small><div style="line-height:1.6;">${text}</div>`;
    chatWindow.appendChild(div);
    chatWindow.scrollTo({ top: chatWindow.scrollHeight, behavior: 'smooth' });
}
</script>
{% endblock %}
