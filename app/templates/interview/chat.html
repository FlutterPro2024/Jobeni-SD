{% extends "base.html" %}
{% block title %}مقابلة ذكية: {{ job.title }}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-9 col-md-11">
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="card-header bg-dark text-white p-3 d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center">
                        <div class="status-dot bg-success rounded-circle me-2"></div>
                        <div>
                            <h6 class="mb-0 fw-bold">مدير التوظيف الذكي (AI)</h6>
                            <small class="text-secondary">{{ job.company_name }}</small>
                        </div>
                    </div>
                    <button id="finish-session-btn" class="btn btn-sm btn-outline-danger border-0 rounded-pill">
                        <i class="fas fa-flag-checkered"></i> إنهاء الجلسة والتقييم
                    </button>
                </div>

                <div class="card-body bg-light px-4 py-4" id="chat-window" style="height: 500px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px;">
                    <div class="ai-msg p-3 bg-white rounded-4 shadow-sm align-self-start border-start border-primary border-4" style="max-width: 85%;">
                        <div class="d-flex align-items-center mb-2">
                            <i class="fas fa-robot text-primary me-2"></i>
                            <strong class="small text-muted">HR Manager</strong>
                        </div>
                        <div class="chat-text" style="white-space: pre-wrap;">{{ first_question }}</div>
                    </div>
                </div>

                <div id="typing-indicator" class="px-4 py-2 bg-light text-muted small" style="display: none;">
                    <span class="spinner-grow spinner-grow-sm text-primary"></span> جاري المعالجة...
                </div>

                <div class="card-footer bg-white p-3 border-0">
                    <div class="input-group shadow-sm rounded-pill overflow-hidden border">
                        <input type="text" id="user-input" class="form-control border-0 px-4 py-2" placeholder="اكتب إجابتك هنا...">
                        <button class="btn btn-primary px-4" id="send-btn"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="reportModal" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header bg-primary text-white border-0">
                <h5 class="modal-title fw-bold">📊 تقييم أداء المقابلة</h5>
            </div>
            <div class="modal-body p-4" id="report-content">
                </div>
            <div class="modal-footer border-0">
                <a href="{{ url_for('applications.my_applications') }}" class="btn btn-primary rounded-pill px-4">العودة للطلبات</a>
            </div>
        </div>
    </div>
</div>

<style>
    .rounded-4 { border-radius: 1rem !important; }
    .status-dot { width: 10px; height: 10px; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
    .user-msg { animation: fadeInRight 0.3s ease; }
    @keyframes fadeInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
</style>

<script>
let chatHistory = "AI: {{ first_question }}\n";
const chatWindow = document.getElementById('chat-window');
const typingIndicator = document.getElementById('typing-indicator');

async function sendMessage() {
    let input = document.getElementById('user-input');
    let message = input.value.trim();
    if(!message) return;

    appendMessage('You', message, 'align-self-end bg-primary text-white user-msg rounded-4 p-3 shadow-sm');
    input.value = "";
    typingIndicator.style.display = 'block';

    const response = await fetch('/interview/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ message, history: chatHistory, job_title: "{{ job.title }}" })
    });

    const data = await response.json();
    typingIndicator.style.display = 'none';
    appendMessage('HR Manager', data.response, 'align-self-start bg-white shadow-sm rounded-4 p-3 border-start border-primary border-4');
    chatHistory += `Candidate: ${message}\nAI: ${data.response}\n`;
}

document.getElementById('send-btn').onclick = sendMessage;
document.getElementById('user-input').onkeypress = (e) => { if(e.which == 13) sendMessage(); };

document.getElementById('finish-session-btn').onclick = async function() {
    if(!confirm('هل تريد إنهاء المقابلة والحصول على تقييمك؟')) return;
    
    typingIndicator.style.display = 'block';
    typingIndicator.innerHTML = "جاري تحليل إجاباتك وإعداد التقرير...";

    const resp = await fetch('/interview/finish', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ history: chatHistory, job_title: "{{ job.title }}" })
    });
    
    const data = await resp.json();
    typingIndicator.style.display = 'none';

    document.getElementById('report-content').innerHTML = `
        <div class="text-center mb-4">
            <h1 class="display-3 fw-bold text-primary">${data.score}</h1>
            <p class="text-muted">درجة الجاهزية الإجمالية</p>
        </div>
        <div class="row g-3">
            <div class="col-md-6"><div class="p-3 bg-success-subtle rounded-3 h-100"><strong>✅ نقاط القوة:</strong><ul>${data.strengths.map(s=>`<li>${s}</li>`).join('')}</ul></div></div>
            <div class="col-md-6"><div class="p-3 bg-danger-subtle rounded-3 h-100"><strong>⚠️ نقاط التطوير:</strong><ul>${data.weaknesses.map(w=>`<li>${w}</li>`).join('')}</ul></div></div>
        </div>
        <div class="mt-4 p-3 bg-light rounded-3 border-start border-4 border-primary"><strong>💡 التقييم النهائي:</strong><p>${data.overall_feedback}</p></div>
        <div class="mt-3 p-3 bg-warning-subtle rounded-3"><strong>🌟 نصيحة ذهبية:</strong><p class="mb-0">${data.recommendation}</p></div>
    `;
    new bootstrap.Modal(document.getElementById('reportModal')).show();
};

function appendMessage(sender, text, classes) {
    let div = document.createElement('div');
    div.className = classes;
    div.style.maxWidth = "85%";
    div.innerHTML = `<small class="d-block mb-1 fw-bold opacity-75">${sender}</small><div>${text}</div>`;
    chatWindow.appendChild(div);
    chatWindow.scrollTop = chatWindow.scrollHeight;
}
</script>
{% endblock %}
