{% extends "base.html" %}

{% block title %}تسجيل الدخول - Jobeni SD{% endblock %}

{% block content %}
<div class="container py-5" dir="rtl">
    <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
        <div class="col-md-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div class="icon-box bg-soft-primary mx-auto mb-3">
                            <i class="fas fa-fingerprint fa-2x text-primary"></i>
                        </div>
                        <h3 class="fw-bold text-dark">مرحباً بك مجدداً</h3>
                        <p class="text-muted small">سجل دخولك لمتابعة رحلتك المهنية</p>
                    </div>

                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-bold small">البريد الإلكتروني</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i class="far fa-envelope text-muted"></i></span>
                                <input type="email" class="form-control bg-light border-0 py-2" id="email" name="email" placeholder="example@gmail.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between">
                                <label for="password" class="form-label fw-bold small">كلمة المرور</label>
                                <a href="#" class="text-decoration-none small">نسيت الكلمة؟</a>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" class="form-control bg-light border-0 py-2" id="password" name="password" placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input shadow-none" id="remember" name="remember">
                            <label class="form-check-label small text-muted" for="remember">تذكرني على هذا الجهاز</label>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold shadow-sm py-3" style="background: var(--gradient-blue); border:none;">
                                دخول <i class="fas fa-sign-in-alt ms-2"></i>
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-5">
                        <p class="text-muted small">ليس لديك حساب؟ <a href="{{ url_for('auth.register') }}" class="fw-bold text-primary text-decoration-none">انضم إلى جوبيني اليوم</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .bg-soft-primary { background-color: #eef4ff; }
    .icon-box { width: 60px; height: 60px; border-radius: 20px; display: flex; align-items: center; justify-content: center; }
    .form-control:focus { background-color: #fff !important; box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.1); border: 1px solid #0d6efd !important; }
</style>
{% endblock %}
