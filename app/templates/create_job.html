<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نشر وظيفة جديدة - Jobeni-SD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('auth.index') }}">Jobeni-SD</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('auth.dashboard') }}">لوحة التحكم</a>
                <a class="nav-link" href="{{ url_for('auth.logout') }}">تسجيل الخروج</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0"><i class="fas fa-plus"></i> نشر وظيفة جديدة</h4>
                    </div>
                    <div class="card-body">
                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                                {% for category, message in messages %}
                                    <div class="alert alert-{{ category }}">{{ message }}</div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}
                        
                        <form method="POST" action="{{ url_for('jobs.create_job') }}">
                            <div class="mb-3">
                                <label for="title" class="form-label">عنوان الوظيفة *</label>
                                <input type="text" class="form-control" id="title" name="title" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="description" class="form-label">وصف الوظيفة *</label>
                                <textarea class="form-control" id="description" name="description" rows="5" required></textarea>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="location" class="form-label">المكان</label>
                                    <input type="text" class="form-control" id="location" name="location" placeholder="مثل: القاهرة، مصر">
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="salary" class="form-label">الراتب</label>
                                    <input type="text" class="form-control" id="salary" name="salary" placeholder="مثل: 5000-8000 جنيه">
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="job_type" class="form-label">نوع الوظيفة</label>
                                <select class="form-select" id="job_type" name="job_type">
                                    <option value="">اختر نوع الوظيفة</option>
                                    <option value="دوام كامل">دوام كامل</option>
                                    <option value="دوام جزئي">دوام جزئي</option>
                                    <option value="عن بعد">عن بعد</option>
                                    <option value="عقد">عقد</option>
                                    <option value="تدريب">تدريب</option>
                                </select>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg">نشر الوظيفة</button>
                                <a href="{{ url_for('jobs.jobs_list') }}" class="btn btn-outline-secondary">إلغاء</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
