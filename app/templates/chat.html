{% extends "base.html" %}
{% block title %}الدردشة مع {{ recipient.username }}{% endblock %}

{% block content %}
<audio id="notifSound" src="{{ url_for('static', filename='sounds/notify.mp3') }}" preload="auto"></audio>

<div class="container py-4 text-end" dir="rtl">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden" style="background: #f8fafc; height: 80vh; display: flex; flex-direction: column;">
                
                <div class="card-header bg-white border-bottom py-3 px-4 d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center">
                        <div class="position-relative ms-3">
                            <img src="{{ recipient.avatar or 'https://ui-avatars.com/api/?name=' + recipient.username }}" class="rounded-circle border" width="48" height="48">
                            <span id="status-dot" class="position-absolute bottom-0 start-0 p-1 bg-secondary border border-2 border-white rounded-circle" style="width: 14px; height: 14px;"></span>
                        </div>
                        <div>
                            <h6 class="fw-bold mb-0 text-dark">{{ recipient.username }}</h6>
                            <small id="typing-indicator" class="text-success fw-bold" style="display: none;">جاري الكتابة...</small>
                            <small id="last-seen-text" class="text-muted small">جاري التحقق من الحالة...</small>
                        </div>
                    </div>
                    <a href="{{ url_for('community.messages') }}" class="btn btn-light rounded-pill btn-sm"><i class="fas fa-arrow-left"></i></a>
                </div>

                <div class="card-body overflow-auto p-4" id="chatWindow" style="flex: 1; background: #eef2f7;">
                    <div id="messages-container">
                        {% for msg in messages %}
                            <div class="d-flex mb-4 {% if msg.sender_id == current_user.id %}justify-content-start flex-row-reverse{% else %}justify-content-start{% endif %}">
                                <div class="p-3 shadow-sm {% if msg.sender_id == current_user.id %}bg-primary text-white ms-2{% else %}bg-white text-dark me-2{% endif %}" style="max-width: 85%; border-radius: 20px;">
                                    <div class="message-content">{{ msg.body | safe }}</div>
                                    <div class="text-start mt-1" style="font-size: 0.6rem; opacity: 0.7;">{{ msg.timestamp.strftime('%I:%M %p') }}</div>
                                </div>
                            </div>
                        {% endfor %}
                    </div>
                </div>

                <div class="card-footer bg-white border-0 p-3">
                    <form id="chatForm" class="d-flex gap-2">
                        <input type="text" id="msgInput" class="form-control rounded-pill border-0 bg-light px-4" placeholder="اكتب رسالتك..." autocomplete="off">
                        <button type="submit" class="btn btn-primary rounded-circle shadow" style="width: 48px; height: 48px;"><i class="fas fa-paper-plane"></i></button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const chatWindow = document.getElementById("chatWindow");
    const msgInput = document.getElementById("msgInput");
    const container = document.getElementById("messages-container");
    const typingIndicator = document.getElementById("typing-indicator");
    const notifSound = document.getElementById("notifSound");
    let lastMsgCount = {{ messages|length }};

    // التمرير للأسفل
    function scrollBottom() { chatWindow.scrollTop = chatWindow.scrollHeight; }
    scrollBottom();

    // إرسال الرسالة عبر AJAX
    document.getElementById('chatForm').onsubmit = async (e) => {
        e.preventDefault();
        const body = msgInput.value;
        if(!body) return;
        msgInput.value = '';
        
        await fetch(window.location.href, {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: `message=${encodeURIComponent(body)}`
        });
        updateChat();
    };

    // تحديث المحادثة والحالة
    async function updateChat() {
        const res = await fetch(window.location.href + '?json=1');
        const data = await res.json();
        
        // جاري الكتابة؟
        typingIndicator.style.display = data.is_typing ? 'block' : 'none';
        
        // الحالة
        const dot = document.getElementById('status-dot');
        dot.className = `position-absolute bottom-0 start-0 p-1 border border-2 border-white rounded-circle ${data.is_online ? 'bg-success' : 'bg-secondary'}`;
        document.getElementById('last-seen-text').innerText = data.is_online ? 'نشط الآن' : 'غير متصل';

        // رسائل جديدة؟
        if (data.messages.length > lastMsgCount) {
            notifSound.play().catch(e => console.log("Sound blocked by browser"));
            // إعادة بناء الرسائل (تبسيطاً)
            location.reload(); 
        }
    }

    // إرسال إشارة "أنا أكتب الآن"
    msgInput.oninput = () => {
        fetch(`/chat/typing/${recipient_id}`, {method: 'POST'});
    };

    setInterval(updateChat, 3000);
</script>
{% endblock %}
